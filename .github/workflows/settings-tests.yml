name: Settings compatibility tests

on:
  pull_request:
    paths:
      - 'src/clawPDF.Settings/**'
      - 'src/lib/DataStorage.dll'
      - 'tests/clawPDF.Settings.Tests/**'
      - '.github/workflows/settings-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test settings and actual HKCU storage on .NET Framework
        run: dotnet test tests/clawPDF.Settings.Tests/clawPDF.Settings.Tests.csproj -f net462 --configuration Release
      - name: Compile the production settings project
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found.' }
          & $msbuild src/clawPDF.Settings/clawPDF.Settings.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /p:SignAssembly=false
          exit $LASTEXITCODE
